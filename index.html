<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>김수정 — Portfolio</title></head><body><script>Promise.all([1,2,3,4,5,6].map(n=>fetch(`./parts/p${n}.html`).then(r=>{if(!r.ok)throw new Error(`${r.status} ${r.url}`);return r.text()}))).then(parts=>{document.open();document.write(parts.join(''));document.close()}).catch(e=>{document.body.innerHTML='<pre style="padding:24px;font-family:system-ui">Portfolio load failed: '+e.message+'</pre>'})</script></body></html>
