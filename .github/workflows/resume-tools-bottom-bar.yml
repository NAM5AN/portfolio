name: Resume tools bottom bar migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resume-tools-bottom-bar.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Move resume tools into bottom bar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          # Remove the old tools block from the left resume pane.
          text, removed = re.subn(
              r'\n\s*<div class="resume-profile-bottom">\s*<div class="resume-skills">.*?</div>\s*</div>',
              '',
              text,
              count=1,
              flags=re.S,
          )
          if removed != 1:
              raise SystemExit(f'Expected to remove one resume-profile-bottom block, removed={removed}')

          bar = '''
    <aside class="resume-tools-bar" aria-label="도구 및 개인 장비">
      <h3 class="resume-tools-title">Tools &amp; Skills</h3>
      <div class="resume-tools-list">
        <span>Premiere Pro</span><span>Photoshop</span><span>Lightroom</span><span>After Effects</span><span>영상 촬영</span><span>사진 촬영</span><span>영상 편집</span><span>사진 편집</span><span>DSLR</span><span>AI</span><span>ChatGPT</span>
      </div>
      <p class="resume-tools-gear">개인 장비 · Canon R6 Mark II · RF 24–105mm · 영상용 삼각대</p>
    </aside>'''

          anchor = '    </section>\n  </main>\n\n  <main class="home" id="work-index">'
          if anchor not in text:
              raise SystemExit('Resume-home closing anchor not found')
          text = text.replace(anchor, '    </section>' + bar + '\n  </main>\n\n  <main class="home" id="work-index">', 1)
          text = re.sub(r'2026081[12][a-z]?', '20260812a', text)
          index.write_text(text, encoding='utf-8')

          css = Path('layout-cleanup.css')
          c = css.read_text(encoding='utf-8')
          marker = '/* Resume-wide tools bottom bar */'
          if marker not in c:
              c += r'''

/* Resume-wide tools bottom bar */
body[data-view="resume"] .resume-home{
  grid-template-rows:minmax(0,1fr) 58px;
}
body[data-view="resume"] .resume-profile,
body[data-view="resume"] .resume-career{
  grid-row:1;
  min-height:0;
}
.resume-tools-bar{
  grid-column:1 / -1;
  grid-row:2;
  min-width:0;
  min-height:58px;
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;
  column-gap:24px;
  padding:0 18px;
  border-top:1px solid var(--ink);
  background:rgba(248,247,242,.98);
}
.resume-tools-title{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:18px;
  line-height:1;
  font-weight:500;
  letter-spacing:-.025em;
  white-space:nowrap;
}
.resume-tools-list{
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  flex-wrap:wrap;
  gap:5px 14px;
}
.resume-tools-list span{
  position:relative;
  padding-left:9px;
  font-size:9px;
  line-height:1.3;
  font-weight:750;
  white-space:nowrap;
}
.resume-tools-list span::before{
  content:"";
  position:absolute;
  left:0;
  top:50%;
  width:4px;
  height:4px;
  background:var(--accent);
  transform:translateY(-50%);
}
.resume-tools-gear{
  margin:0;
  color:var(--muted);
  font-size:9px;
  line-height:1.35;
  text-align:right;
  white-space:nowrap;
}

@media(max-width:1100px){
  .resume-tools-bar{column-gap:16px;padding-inline:12px}
  .resume-tools-list{gap:4px 10px}
  .resume-tools-list span,.resume-tools-gear{font-size:8px}
  .resume-tools-title{font-size:16px}
}

@media(max-width:900px){
  body[data-view="resume"] .resume-home{grid-template-rows:none}
  .resume-tools-bar{
    min-height:0;
    grid-template-columns:1fr;
    gap:9px;
    padding:15px 18px 17px;
    border-bottom:1px solid var(--line);
  }
  .resume-tools-gear{text-align:left;white-space:normal}
}
'''
          css.write_text(c, encoding='utf-8')

          loader = Path('site-v2.js')
          s = loader.read_text(encoding='utf-8')
          s = re.sub(r'2026081[12][a-z]?', '20260812a', s)
          loader.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/resume-tools-bottom-bar.yml
          git config user.name 'NAM5AN'
          git config user.email '133747621+NAM5AN@users.noreply.github.com'
          git add index.html layout-cleanup.css site-v2.js .github/workflows/resume-tools-bottom-bar.yml
          git commit -m 'feat: move resume tools into bottom bar'
          git push
