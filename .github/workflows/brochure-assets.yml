name: Render brochure pages

on:
  push:
    paths:
      - '.github/workflows/brochure-assets.yml'

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer
        run: pip install --quiet gdown pymupdf pillow

      - name: Download source PDF
        run: gdown 'https://drive.google.com/uc?id=1LpuHTScGx8wOIi7bsNizfOnVMZj3KwFu' -O /tmp/brochure.pdf

      - name: Render 18 optimized pages
        run: |
          python - <<'PY'
          import fitz
          from PIL import Image
          from pathlib import Path

          pdf = fitz.open('/tmp/brochure.pdf')
          out = Path('assets/brochure')
          out.mkdir(parents=True, exist_ok=True)

          for i, page in enumerate(pdf, start=1):
              pix = page.get_pixmap(matrix=fitz.Matrix(1.55, 1.55), alpha=False)
              image = Image.frombytes('RGB', (pix.width, pix.height), pix.samples)
              if image.height > 1200:
                  width = round(image.width * 1200 / image.height)
                  image = image.resize((width, 1200), Image.Resampling.LANCZOS)
              image.save(out / f'page-{i:02d}.webp', 'WEBP', quality=72, method=6)

          if len(list(out.glob('page-*.webp'))) != 18:
              raise SystemExit('Expected 18 rendered brochure pages')
          PY

      - name: Commit brochure assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brochure
          git diff --cached --quiet && exit 0
          git commit -m 'assets: add brochure book pages'
          git push
